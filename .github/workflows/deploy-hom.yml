# Deploy automático do ambiente de homologação (https://insightflow-hom.netlify.app).
# O plano grátis da Netlify não conecta repositório privado de organização, então o build roda
# aqui e o resultado é enviado pela Netlify CLI — o mesmo `netlify deploy` feito na mão.
# O netlify.toml continua valendo: proxy de /api/* para a API hom e VITE_WS_URL no build.
name: Deploy homologação (Netlify)

on:
  push:
    branches: [main]
  workflow_dispatch:

# Um deploy por vez; se chegar outro push, o mais novo substitui o que estiver na fila.
concurrency:
  group: deploy-hom
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
    steps:
      - name: Conferir secrets
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "::error::Cadastre NETLIFY_AUTH_TOKEN e NETLIFY_SITE_ID em Settings → Secrets and variables → Actions."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Build e deploy
        run: npx -y netlify-cli@27.13.0 deploy --build --prod --message "main ${GITHUB_SHA::7}"
