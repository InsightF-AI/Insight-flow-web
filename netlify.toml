[build]
  command = "npm run build"
  publish = "dist"

# Ambiente de homologação: o WebSocket de notificações conecta direto na API (WebSocket não
# passa por CORS e a API não valida Origin). Lido pelo Vite no build.
[build.environment]
  VITE_WS_URL = "wss://hom-api-insight.agilesoftware.net.br/api/v1/notificacoes/ws"

# REST: a Netlify repassa /api/* pra API de homologação (mesmo papel do proxy do Vite em dev).
# Pro navegador é same-origin, então não há preflight de CORS — o backend não precisa liberar
# o domínio do front. Tem que vir antes do fallback da SPA.
[[redirects]]
  from = "/api/*"
  to = "https://hom-api-insight.agilesoftware.net.br/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
